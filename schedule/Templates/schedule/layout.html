<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">


        <style>
        /* Header sticky */
        .table thead th {
            position: sticky;
            top: 0; /* Header al inicio del scroll */
            z-index: 100; /* Sobreponer a las filas de la misma tabla */
        }
        </style>

        <title>F1 schedule</title>
    </head>
    <body>
        <nav class="navbar navbar-dark bg-dark">
            <a class="navbar-brand" href="">F1 schedule</a>
            
            <button class="btn btn-primary d-inline-flex align-items-center">
                <svg xmlns="http://w3.org" viewBox="0 0 640 640" width="20" height="20" fill="currentColor">
                    <path d="M415.9 344L225 344C227.9 408.5 242.2 467.9 262.5 511.4C273.9 535.9 286.2 553.2 297.6 563.8C308.8 574.3 316.5 576 320.5 576C324.5 576 332.2 574.3 343.4 563.8C354.8 553.2 367.1 535.8 378.5 511.4C398.8 467.9 413.1 408.5 416 344zM224.9 296L415.8 296C413 231.5 398.7 172.1 378.4 128.6C367 104.2 354.7 86.8 343.3 76.2C332.1 65.7 324.4 64 320.4 64C316.4 64 308.7 65.7 297.5 76.2C286.1 86.8 273.8 104.2 262.4 128.6C242.1 172.1 227.8 231.5 224.9 296zM176.9 296C180.4 210.4 202.5 130.9 234.8 78.7C142.7 111.3 74.9 195.2 65.5 296L176.9 296zM65.5 344C74.9 444.8 142.7 528.7 234.8 561.3C202.5 509.1 180.4 429.6 176.9 344L65.5 344zM463.9 344C460.4 429.6 438.3 509.1 406 561.3C498.1 528.6 565.9 444.8 575.3 344L463.9 344zM575.3 296C565.9 195.2 498.1 111.3 406 78.7C438.3 130.9 460.4 210.4 463.9 296L575.3 296z"/>
                </svg>
                <strong id="user-timezone"> Detectando...</strong>
            </button>
        </nav>
        
        {% block body %}
        {% endblock %}

        <script>
            function change_timeZone(timeZone){
                //Zona horaria del navegador
                const userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const tzDisplay = document.getElementById("user-timezone");
                if (tzDisplay) {
                    tzDisplay.textContent = userTimeZone;
                }

                // Config el formatter daod el lenguaje
                const dateFormatter = new Intl.DateTimeFormat(navigator.language, {
                    weekday: 'short',
                    day: 'numeric',
                    month: 'short',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false // false 24h
                });

                // Por cada clase .utc-time transformar la fecha de UTC a local
                document.querySelectorAll('.utc-time').forEach(el => {
                    const utcStr = el.getAttribute('data-utc');
                    if (utcStr) {
                        const localDate = new Date(utcStr);
                        // Si la fecha es válida, la reemplaza
                        if (!isNaN(localDate)) {
                            el.textContent = dateFormatter.format(localDate);
                        }
                    }
                });
            }


            document.addEventListener("DOMContentLoaded", function(){
                change_timeZone()
            });
        </script>   

        <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    </body>
</html>
