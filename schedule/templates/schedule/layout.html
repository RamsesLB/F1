{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>F1 schedule</title>

        <!--Bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        
        <!--Own css-->
        <link rel="stylesheet" href="{% static 'schedule/css/style.css' %}">
        
    </head>
    <body>
        <nav class="navbar navbar-dark bg-dark ">
            <div class="container-fluid">
                <a class="navbar-brand" href="">
                    <img src="/static/schedule/favicon.ico" width="30" height="30" alt="">
                    F1 schedule
                </a>
                
                <div class="dropdown ">
                    <button class="btn btn-primary d-inline-flex align-items-center dropdown-toggle" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
                        <svg xmlns="http://w3.org" viewBox="0 0 640 640" width="20" height="20" fill="currentColor">
                            <path d="M415.9 344L225 344C227.9 408.5 242.2 467.9 262.5 511.4C273.9 535.9 286.2 553.2 297.6 563.8C308.8 574.3 316.5 576 320.5 576C324.5 576 332.2 574.3 343.4 563.8C354.8 553.2 367.1 535.8 378.5 511.4C398.8 467.9 413.1 408.5 416 344zM224.9 296L415.8 296C413 231.5 398.7 172.1 378.4 128.6C367 104.2 354.7 86.8 343.3 76.2C332.1 65.7 324.4 64 320.4 64C316.4 64 308.7 65.7 297.5 76.2C286.1 86.8 273.8 104.2 262.4 128.6C242.1 172.1 227.8 231.5 224.9 296zM176.9 296C180.4 210.4 202.5 130.9 234.8 78.7C142.7 111.3 74.9 195.2 65.5 296L176.9 296zM65.5 344C74.9 444.8 142.7 528.7 234.8 561.3C202.5 509.1 180.4 429.6 176.9 344L65.5 344zM463.9 344C460.4 429.6 438.3 509.1 406 561.3C498.1 528.6 565.9 444.8 575.3 344L463.9 344zM575.3 296C565.9 195.2 498.1 111.3 406 78.7C438.3 130.9 460.4 210.4 463.9 296L575.3 296z"/>
                        </svg>
                        <strong id="user-timezone"> Detectando...</strong>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-lg-end" aria-labelledby="dropdownMenuButton1" id="user-timezone-dropdown" style="max-height: 400px; overflow-y: auto; z-index:1000;">
                        <!-- Search bar-->
                        <li class="px-3 py-2">
                            <input type="text" class="form-control" id="dropdownSearchInput" placeholder="Search..." autocomplete="off">
                        </li>
                        <!-- Divisor -->
                        <li><hr class="dropdown-divider"></li>
                    </ul>
                </div>
            </div>
            
        </nav>
        
        {% block body %}
        {% endblock %}

        <script>
            function fill_timeZones(){
                const timeZones = Intl.supportedValuesOf('timeZone')
                dropdownTimeZone = document.getElementById("user-timezone-dropdown")

                timeZones.forEach(timeZone => {
                    let li = document.createElement('li');
                    
                    // Elementos de li
                    let a = document.createElement('a');
                    a.className = "dropdown-item";
                    a.href = "#"; 
                    a.textContent = timeZone;

                    a.onclick = (e) => {
                        e.preventDefault(); 
                        change_timeZone(timeZone); 
                    };

                    li.appendChild(a);
                    dropdownTimeZone.appendChild(li);
                })
            }

            function change_timeZone(timeZone){
                //Zona horaria del navegador (al iniciar página) o indicada por el usuario (seleccionar dropdown)
                const userTimeZone = timeZone || Intl.DateTimeFormat().resolvedOptions().timeZone ;

                const tzDisplay = document.getElementById("user-timezone");
                if (tzDisplay) {
                    tzDisplay.textContent = userTimeZone;
                }

                // Config el formatter daod el lenguaje
                const dateFormatter = new Intl.DateTimeFormat(navigator.language, {
                    timeZone: userTimeZone,
                    weekday: 'short',
                    day: 'numeric',
                    month: 'short',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false // false 24h
                });

                // Por cada clase .utc-time transformar la fecha de UTC a local
                document.querySelectorAll('.utc-time').forEach(el => {
                    const utcStr = el.getAttribute('data-utc');
                    if (utcStr) {
                        const localDate = new Date(utcStr);
                        // Si la fecha es válida, la reemplaza
                        if (!isNaN(localDate)) {
                            el.textContent = dateFormatter.format(localDate);
                        }
                    }
                });
            }

            function scroll_to_nextRace() {
                const filaProximaCarrera = document.getElementById("proxima-carrera");
                
                if (filaProximaCarrera) {
                    // Obtener contenedor
                    const contenedorTabla = filaProximaCarrera.closest('div');
                    
                    if (contenedorTabla) {
                        // Timeout para esperar a que cargue la tabla y sus componentes
                        setTimeout(() => {
                            // Posición de la fila relativa al contenedor
                            const posicionFila = filaProximaCarrera.offsetTop - contenedorTabla.offsetTop +45;
                            
                            contenedorTabla.scrollTo({
                                top: posicionFila,
                                behavior: "smooth"
                            });
                        }, 160);
                    }
                }
            }

            document.getElementById('dropdownSearchInput').addEventListener('keyup', function(event) {
                const searchText = event.target.value.toLowerCase();
                const dropdownItems = document.querySelectorAll('#user-timezone-dropdown .dropdown-item:not(#noResultsMessage)');
                let hasResults = false;

                dropdownItems.forEach(function(item) {
                    const itemText = item.textContent.toLowerCase();
                    
                    // Filtra comparando el texto del elemento con la búsqueda
                    if (itemText.includes(searchText)) {
                        item.classList.remove('d-none');
                        hasResults = true;
                    } else {
                        item.classList.add('d-none');
                    }
                });

                
                const noResults = document.getElementById('noResultsMessage');
                if (hasResults) {
                    noResults.classList.add('d-none');
                } else {
                    noResults.classList.remove('d-none');
                }
            });


            document.addEventListener("DOMContentLoaded", function(){
                change_timeZone()
                scroll_to_nextRace()
                fill_timeZones()
                
            });
        </script>   

        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    </body>
</html>
