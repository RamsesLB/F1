            <nav class="navbar navbar-expand-lg  navbar-dark bg-dark ">
                <div class="container-fluid">

                     <!--Burger button-->
                    <button class="navbar-toggler border-0 px-1 me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    
                    <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel" style="--bs-offcanvas-width: 50vw;">
            
                        <!-- Offcanvas header (only phone) -->
                        <div class="offcanvas-header border-bottom border-secondary d-lg-none">
                            <a class="navbar-brand m-0" href="{% url 'index' %}">
                                <img src="/static/schedule/favicon.ico" width="30" height="30" alt="">
                                <span>{% trans "F1 schedule"%}</span>
                            </a>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                        </div>

                        <!-- Offcanvas body -->
                        <div class="offcanvas-body align-items-baseline">
                            <!-- Pc web only -->
                            <a class="navbar-brand d-none d-lg-inline-block me-4" href="{% url 'index' %}">
                                <img src="/static/schedule/favicon.ico" width="30" height="30" alt="">
                                <span>{% trans "F1 schedule"%}</span>
                            </a>
                            
                            <!--Both pc and phone-->
                            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                                <li class="nav-item">
                                    <a class="nav-link active" aria-current="page" href="{% url 'index' %}">{% trans "Home"%}</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link active" aria-current="page" href="{% url 'standings_index'%}">{%trans "Standings"%}</a>

                    </div>

                    

                    <div class="d-flex align-items-center ms-auto order-lg-last">
                       
                        <!--Language dropdown-->
                        <form action="{% url 'set_language' %}" method="post" class="d-flex align-items-center ms-auto text-white me-2">
                            {% csrf_token %}
                            <!-- Redirect to the same url -->
                            <input name="next" type="hidden" value="{{ request.get_full_path }}">

                            <div class="input-group input-group-sm border rounded">
                                <span class="input-group-text bg-transparent border-1 pe-1 text-white">
                                    <svg class="bi flex-shrink-0" width="18" height="18" role="img" aria-label="Language:">
                                        <use href="#globe-white"/>
                                    </svg>
                                </span>
                                <select class="form-select w-auto bg-black text-white border-1 shadow-none " 
                                        name="language" id="langSelect" onchange="this.form.submit();">
                                    <option value="es" {% if LANGUAGE_CODE == 'es' %} selected {% endif %}>ES</option>
                                    <option value="en" {% if LANGUAGE_CODE == 'en' %} selected {% endif %}>EN</option>
                                </select>
                            </div>
                        </form>
                        <!--TimeZone dropdown-->
                        <div class="dropdown  input-group-sm rounded">
                            <button class="btn btn-primary d-inline-flex align-items-center dropdown-toggle" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
                                <svg class="bi flex-shrink-0 me-2" width="24" height="24" role="img" aria-label="Info:"><use href="#time-white"/></svg>
                                <strong id="user-timezone"> Detectando...</strong>
                            </button>

                            <ul class="dropdown-menu dropdown-menu-lg-end" aria-labelledby="dropdownMenuButton1" id="user-timezone-dropdown" style="max-height: 400px; overflow-y: auto; z-index:1000;">
                                <!-- Search bar-->
                                <li class="px-3 py-2">
                                    <input type="text" class="form-control" id="dropdownSearchInput" placeholder="Search..." autocomplete="off">
                                </li>
                                <!-- Divisor -->
                                <li><hr class="dropdown-divider"></li>
                            </ul>
                        </div>

            {% block body %}

        </main>

         <footer class="py-3 bg-light text-center border-top">
            <div class="container">
                <span class="text-muted">Portfolio Project (WIP).</span>
            </div>
        </footer>

        <script>
            function fill_timeZones(){
                const timeZones = Intl.supportedValuesOf('timeZone')
                dropdownTimeZone = document.getElementById("user-timezone-dropdown")

                timeZones.forEach(timeZone => {
                    let li = document.createElement('li');
                    
                    // Elementos de li
                    let a = document.createElement('a');
                    a.className = "dropdown-item";
                    a.href = "#"; 
                    a.textContent = timeZone;

                    a.onclick = (e) => {
                        e.preventDefault(); 
                        change_timeZone(timeZone); 
                    };

                    li.appendChild(a);
                    dropdownTimeZone.appendChild(li);
                })
            }

            function change_timeZone(timeZone){
                //Zona horaria del navegador (al iniciar página) o indicada por el usuario (seleccionar dropdown)
                const userTimeZone = timeZone || Intl.DateTimeFormat().resolvedOptions().timeZone ;

                const tzDisplay = document.getElementById("user-timezone");
                if (tzDisplay) {
                    tzDisplay.textContent = userTimeZone;
                }
                
                // Show Date in the chosen language
                langSelect = document.getElementById("langSelect");
                const lang = langSelect.value || navigator.language;
                console.log(lang);

                // Format DateTime
                const dateFormatter = new Intl.DateTimeFormat(lang, {
                    timeZone: userTimeZone,
                    weekday: 'short',
                    day: 'numeric',
                    month: 'short',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false // false 24h
                });
                
                // Por cada clase .utc-time transformar la fecha de UTC a local
                document.querySelectorAll('.utc-time').forEach(el => {
                    const utcStr = el.getAttribute('data-utc');
                    if (utcStr) {
                        const localDate = new Date(utcStr);
                        // Si la fecha es válida, la reemplaza
                        if (!isNaN(localDate)) {
                            el.textContent = dateFormatter.format(localDate);
                        }
                    }
                });
            }

            function scroll_to_nextRace() {
                const filaProximaCarrera = document.getElementById("proxima-carrera");
                
                if (filaProximaCarrera) {
                    // Obtener contenedor
                    const contenedorTabla = filaProximaCarrera.closest('div');
                    
                    if (contenedorTabla) {
                        // Timeout para esperar a que cargue la tabla y sus componentes
                        setTimeout(() => {
                            // Posición de la fila relativa al contenedor
                            const posicionFila = filaProximaCarrera.offsetTop - contenedorTabla.offsetTop +45;
                            
                            contenedorTabla.scrollTo({
                                top: posicionFila,
                                behavior: "smooth"
                            });
                            // Luego del scroll se separa la lista en 2 (next y past)
                            separate_races('none','','text-secondary','active', 'active', 'text-secondary')
            
                        }, 160);
                    }
                }
            }

            document.getElementById('dropdownSearchInput').addEventListener('keyup', function(event) {
                const searchText = event.target.value.toLowerCase();
                const dropdownItems = document.querySelectorAll('#user-timezone-dropdown .dropdown-item:not(#noResultsMessage)');
                let hasResults = false;

                dropdownItems.forEach(function(item) {
                    const itemText = item.textContent.toLowerCase();
                    
                    // Filtra comparando el texto del elemento con la búsqueda
                    if (itemText.includes(searchText)) {
                        item.classList.remove('d-none');
                        hasResults = true;
                    } else {
                        item.classList.add('d-none');
                    }
                });

                
                const noResults = document.getElementById('noResultsMessage');
                if (hasResults) {
                    noResults.classList.add('d-none');
                } else {
                    noResults.classList.remove('d-none');
                }
            });
            

            function separate_races(pastRaces_style, nextRaces_style, pastTab_classAdd, pastTab_classRemove, 
                nextTab_classAdd, nextTab_classRemove){

                const nextTab = document.getElementById('next-tab');
                const pastTab = document.getElementById('past-tab');

                const pastRaces = document.querySelectorAll('.race-past');
                const nextRaces = document.querySelectorAll('.race-next');

                if (pastRaces && nextRaces){
                    pastRaces.forEach(row => row.style.display = pastRaces_style);
                    nextRaces.forEach(row => row.style.display = nextRaces_style);

                    // Cambiar estilo 
                    pastTab.classList.add(pastTab_classAdd);
                    pastTab.classList.remove(pastTab_classRemove);
                    nextTab.classList.add(nextTab_classAdd);
                    nextTab.classList.remove(nextTab_classRemove);
                }
            }

            document.addEventListener("DOMContentLoaded", function(){
                past_tab = document.getElementById('past-tab')
                next_tab = document.getElementById('next-tab')
                if (past_tab){
                    // Previous races boton keyup
                    document.getElementById('past-tab').addEventListener('click', function(event) {
                        separate_races('','none','active','text-secondary', 'text-secondary', 'active')
                    });
                }
                if (next_tab){
                    // Next races boton keyup
                    document.getElementById('next-tab').addEventListener('click', function(event) {
                        separate_races('none','','text-secondary','active', 'active', 'text-secondary')
                    });
                }

                change_timeZone()
                //scroll_to_nextRace()
                separate_races('none','','text-secondary','active', 'active', 'text-secondary')
                fill_timeZones()
                
            });
        </script>   

        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    </body>
</html>
